{% set name = "jupytext" %}
{% set version = "1.16.7" %}
package:
  name: {{ name|lower }}
  version: {{ version }}
source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/jupytext-{{ version }}.tar.gz
  sha256: fc4e97f0890e22062c4ef10313c7ca960b07b3767246a1fef7585888cc2afe5d
build:
  skip: true  # [py<38]
  entry_points:
    - jupytext = jupytext.cli:jupytext
    - jupytext-config = jupytext_config.__main__:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
requirements:
  host:
    - python >=3.8
    - hatchling >=1.5.0
    - pip
  run:
    - python >=3.8
    - nbformat
    - mdit-py-plugins
    - markdown-it-py >=1.0
    - packaging
    - pyyaml
    - tomli # [py<311]
test:
  imports:
    - jupytext
  commands:
    - pip check
    - jupytext --help
    - jupytext-config --help
  requires:
    - pip
about:
  summary: Jupyter notebooks as Markdown documents, Julia, Python or R scripts
  license: MIT
  license_file: LICENSE
extra:
  recipe-maintainers:
    - Arishamays1
